name: Build Local Library APK

# 本地书库改造版的简化构建流程
# 触发方式：手动 (workflow_dispatch) 或推送 tag (如 v0.2.3-local1)

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: '版本后缀 (如 local1)'
        required: false
        default: 'local'
  push:
    tags: ['v*-local*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run local library tests
        run: flutter test test/local_library_test.dart

      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh $APK
          # 确认包含 arm64 的 libapp.so
          unzip -l $APK | grep "lib/arm64-v8a/libapp.so"

      - uses: actions/upload-artifact@v4
        with:
          name: wenku8-local-${{ github.ref_name || inputs.version_suffix || 'dev' }}-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
