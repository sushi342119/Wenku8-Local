name: Prepare Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/android-release.yml']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        run: |
          RAW_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml)"
          APP_VERSION="${RAW_VERSION%%+*}"
          APP_BUILD="${RAW_VERSION#*+}"
          TAG="v${RAW_VERSION}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag does not match pubspec"; exit 1
          fi
          python3 tools/prepare_release.py --tag "$TAG" --notes build/release-notes.md
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$APP_BUILD" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # Always retain full diagnostics, including asynchronous UI failures.
      - name: Run tests with process deadline
        timeout-minutes: 15
        shell: bash
        run: |
          # Preserve the test process exit code through the log pipe.
          set -euo pipefail
          mkdir -p build
          timeout --signal=TERM --kill-after=15s 720s flutter test --reporter expanded --timeout 60s 2>&1 | tee build/flutter-tests.log
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.workflow }}
          path: build/flutter-tests.log
          if-no-files-found: ignore
      - name: Verify release tooling
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Configure persistent release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 tools/configure_signing.py
      - name: Build signed APK
        if: github.event_name != 'pull_request'
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=UPDATE_REPOSITORY=${{ github.repository }} \
            --dart-define=APP_VERSION=${{ env.APP_VERSION }} \
            --dart-define=APP_BUILD=${{ env.APP_BUILD }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: shuyu-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Export matching source
        run: |
          python3 tools/export_public_source.py ../shuyu-source
          cd ..
          zip -qr "${GITHUB_WORKSPACE}/build/shuyu-source.zip" shuyu-source
      - name: Name compatible update asset
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/wenku8-local-${RELEASE_TAG}-arm64-v8a.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "build/wenku8-local-${RELEASE_TAG}-arm64-v8a.apk" build/shuyu-source.zip --clobber
          elif [[ "$GITHUB_REF_TYPE" == "tag" || ( "$GITHUB_REF" == "refs/heads/main" && "$RELEASE_TAG" == "v1.7.0+45" ) ]]; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --latest --title "书屿 $RELEASE_TAG" --notes-file build/release-notes.md "build/wenku8-local-${RELEASE_TAG}-arm64-v8a.apk" build/shuyu-source.zip
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "书屿 $RELEASE_TAG" --notes-file build/release-notes.md "build/wenku8-local-${RELEASE_TAG}-arm64-v8a.apk" build/shuyu-source.zip
          fi
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/release.keystore
