name: Prepare Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/android-release.yml', 'pubspec.yaml']
permissions:
  contents: write
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        run: |
          RAW_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml)"
          APP_VERSION="${RAW_VERSION%%+*}"
          APP_BUILD="${RAW_VERSION#*+}"
          TAG="v${RAW_VERSION}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag does not match pubspec"; exit 1
          fi
          python3 tools/prepare_release.py --tag "$TAG" --notes build/release-notes.md
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$APP_BUILD" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # Always retain full diagnostics, including asynchronous UI failures.
      - name: Run tests with process deadline
        timeout-minutes: 15
        shell: bash
        run: |
          # Preserve the test process exit code through the log pipe.
          set -euo pipefail
          mkdir -p build
          timeout --signal=TERM --kill-after=15s 720s flutter test --reporter expanded --timeout 60s 2>&1 | tee build/flutter-tests.log
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.workflow }}
          path: build/flutter-tests.log
          if-no-files-found: ignore
      - name: Verify release tooling
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Configure persistent release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 tools/configure_signing.py
      - name: Build signed APK
        if: github.event_name != 'pull_request'
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=UPDATE_REPOSITORY=${{ github.repository }} \
            --dart-define=APP_VERSION=${{ env.APP_VERSION }} \
            --dart-define=APP_BUILD=${{ env.APP_BUILD }}
      - name: Verify update identity against published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline="$(mktemp -d)"
          trap 'rm -rf "$baseline"' EXIT
          gh release download 'v1.8.2+49' --repo "$GITHUB_REPOSITORY" \
            --pattern 'wenku8-local-v1.8.2+49-arm64-v8a.apk' --dir "$baseline"
          python3 - "$baseline/wenku8-local-v1.8.2+49-arm64-v8a.apk" <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          signer = max(Path(os.environ["ANDROID_HOME"]).glob("build-tools/*/apksigner"),
                       key=lambda path: tuple(map(int, re.findall(r"\d+", path.parent.name))))
          aapt = signer.parent / "aapt"
          def inspect(path):
              badging = subprocess.check_output([str(aapt), "dump", "badging", path], text=True)
              package = re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", badging)
              if package is None:
                  raise SystemExit("Cannot read APK package identity")
              report = subprocess.check_output([str(signer), "verify", "--verbose", "--print-certs", path], text=True)
              # Build Tools 37 labels scheme signers as "V2 Signer:"; older
              # versions use "Signer #1". Exclude source stamps and key hashes.
              label = r"(?:Signer #\d+|Signer \(minSdkVersion=[^\r\n]+\)|V[1-4](?:\.\d+)? Signer(?: #\d+)?(?: \(minSdkVersion=[^\r\n]+\))?)"
              certificates = {digest.lower() for digest in re.findall(
                  rf"^{label}:? certificate SHA-256 digest: ([0-9a-fA-F]{{64}})[ \t]*$", report, re.M)}
              if not certificates:
                  raise SystemExit("Cannot read verified APK signing certificates")
              return package[1], int(package[2]), package[3], certificates

          old = inspect(sys.argv[1])
          new = inspect("build/app/outputs/flutter-apk/app-release.apk")
          if old[0] != "org.mewx.wenku8_flutter" or new[0] != "app.shuyu.reader" or new[3] != old[3]:
              raise SystemExit("APK application ID or signing certificate changed; refusing release")
          if old[1:3] != (49, "1.8.2") or new[1] != int(os.environ["APP_BUILD"]) or new[1] <= old[1] or new[2] != os.environ["APP_VERSION"]:
              raise SystemExit("APK version metadata is incompatible")
          print(f"Verified package {new[0]} and same-certificate update: {old[2]}+{old[1]} -> {new[2]}+{new[1]}")
          print("Signing certificate SHA-256:", ", ".join(sorted(new[3])))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: shuyu-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Export matching source
        run: |
          python3 tools/export_public_source.py ../shuyu-source
          cd ..
          zip -qr "${GITHUB_WORKSPACE}/build/shuyu-source.zip" shuyu-source
      - name: Name compatible update asset
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/wenku8-local-${RELEASE_TAG}-arm64-v8a.apk"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Include drafts and every page; an API failure must stop creation.
          releases="$(mktemp)"
          trap 'rm -f "$releases"' EXIT
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$releases"
          python3 - "$releases" <<'PY'
          import json
          import os
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              pages = json.load(source)
          if any(release["tag_name"] == os.environ["RELEASE_TAG"] for page in pages for release in page):
              raise SystemExit("Release already exists (including drafts); use a new build number and tag")
          PY
          # Never replace existing assets or publish without manual review.
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "书屿 $RELEASE_TAG" --notes-file build/release-notes.md "build/wenku8-local-${RELEASE_TAG}-arm64-v8a.apk" build/shuyu-source.zip
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/release.keystore
