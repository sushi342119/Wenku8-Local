name: Flutter Android

on:
  push:
    branches: ['master']
    paths: ['lib/**', 'test/**', 'android/**', 'shaders/**', 'assets/**', 'tools/**', 'pubspec.*', 'analysis_options.yaml', '.github/workflows/flutter-ci.yml', '.github/workflows/android-release.yml']
  pull_request:
    paths: ['lib/**', 'test/**', 'android/**', 'shaders/**', 'assets/**', 'tools/**', 'pubspec.*', 'analysis_options.yaml', '.github/workflows/flutter-ci.yml', '.github/workflows/android-release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: python3 tools/check_public_source.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build Android preview
        run: flutter build apk --release --target-platform android-arm64
      - run: python3 tools/verify_apk_runtime.py build/app/outputs/flutter-apk/app-release.apk --abi arm64-v8a
      - name: Native speech policy tests
        run: cd android && ./gradlew :app:testReleaseUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-preview
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
